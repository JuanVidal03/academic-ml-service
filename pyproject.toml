[project]
name = "dropout-service"
version = "1.0.0"
description = "ML service for academic dropout prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "numpy>=2.1.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.53.0",
]

# Makes `dropout_service` a real installed package, so `import dropout_service`,
# uvicorn and the scripts all work without a PYTHONPATH hack.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropout_service"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-cov>=7.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Our own code must not emit deprecation warnings.
    "error::FutureWarning:dropout_service.*",
]
